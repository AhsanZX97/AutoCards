<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06b6d4" />
    <meta
      name="description"
      content="Auto Cards turns your slides, documents and notes into smart, customizable flashcards in seconds."
    />

    <!-- What a link to Auto Cards looks like when someone posts it. Without
         these it renders as a bare URL in every chat app and feed. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Auto Cards" />
    <meta property="og:title" content="Auto Cards — Turn your notes into flashcards" />
    <meta
      property="og:description"
      content="Upload your slides, notes or a chapter and get a study-ready flashcard deck in seconds."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Auto Cards — Turn your notes into flashcards" />
    <meta
      name="twitter:description"
      content="Upload your slides, notes or a chapter and get a study-ready flashcard deck in seconds."
    />
    <meta name="twitter:image" content="/og-image.png" />
    <link rel="canonical" href="https://autocards.study/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Fonts are self-hosted (@fontsource-variable, imported in app.css) so
         the first paint never blocks on fonts.googleapis.com. The preload
         links for the two Latin woff2 files are injected at build time by
         vite.config.ts, once their hashed filenames exist.

         This file is also the template the prerender script
         (src/seo/entry-server.tsx + scripts/prerender.mjs) starts from for
         every route: it replaces the page title, the description/OG/Twitter
         meta and the canonical link above with that route's own values. The
         SoftwareApplication JSON-LD lives only on the landing page — see
         src/seo/LandingJsonLd.tsx — not here, since this shell is shared by
         every route. -->
    <title>Auto Cards — Turn your notes into flashcards</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
